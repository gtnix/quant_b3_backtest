# Cargo configuration for cross-compilation
# Enables static binary compilation for Linux deployment

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "target-feature=+crt-static"]

[build]
# Uncomment to make musl the default target:
# target = "x86_64-unknown-linux-musl"

[profile.release]
lto = true
codegen-units = 1
strip = true
