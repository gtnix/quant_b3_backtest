# Cargo configuration for performance optimization
# NASA-level: target-cpu=native enables all CPU features (AVX-512 on supported CPUs)

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "target-feature=+avx2,+fma"
]

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "target-feature=+crt-static", "-C", "target-cpu=x86-64-v3"]

[build]
# Use all CPU cores (default behavior when omitted)

[alias]
bench-ultra = "bench --profile=ultra"
