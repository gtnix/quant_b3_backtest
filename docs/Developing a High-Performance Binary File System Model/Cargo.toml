[package]
name = "obfs_prototype"
version = "0.1.0"
edition = "2021"

[dependencies]
# Zero-copy serialization
rkyv = { version = "0.8", features = ["validation"] }

# Hashing and integrity
blake3 = { version = "1.5", features = ["rayon"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Compression
zstd = "0.13"

# LMDB for metadata store
heed = { version = "0.20", features = ["read-txn-no-tls"] }

# Arrow and Parquet for columnar storage
arrow = { version = "57", features = ["ipc"] }
parquet = { version = "57", features = ["arrow", "zstd"] }

# Memory mapping
memmap2 = "0.9"

# Serialization helpers
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async runtime (optional for future io_uring integration)
tokio = { version = "1.41", features = ["full"], optional = true }

# Time-series compression (specialized)
# Note: These crates may need to be added manually or replaced with alternatives
# tsink = "0.2"  # Gorilla compression
# tms = "0.1"    # SIMD time-series compression

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.13"

[[bench]]
name = "compression_benchmark"
harness = false

[[bench]]
name = "read_write_benchmark"
harness = false

[features]
default = []
async-io = ["tokio"]
