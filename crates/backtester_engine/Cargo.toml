[package]
name = "backtester_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Simulation motor and order router for the backtester"

[dependencies]
backtester_core = { workspace = true, features = ["decimal"] }
backtester_portfolio.workspace = true
backtester_execution.workspace = true
backtester_reports.workspace = true
backtester_intelligence.workspace = true
rayon = { workspace = true }
chrono = "0.4"
rust_decimal = { version = "1.39", features = ["maths"] }
rust_decimal_macros = "1.39"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "engine_bench"
harness = false

[[bench]]
name = "unified_bench"
harness = false

