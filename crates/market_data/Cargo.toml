[package]
name = "market_data"
version = "0.1.0"
edition = "2021"
description = "B3 market data ingestion pipeline with Brapi + Neon"

[[bin]]
name = "market-data"
path = "src/main.rs"

[[bin]]
name = "seed_calendars"
path = "src/bin/seed_calendars.rs"

[[bin]]
name = "calendar_sync"
path = "src/bin/calendar_sync.rs"

[[bin]]
name = "validate_calendar"
path = "src/bin/validate_calendar.rs"

[lib]
name = "market_data"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
tokio-postgres-rustls = "0.12"
rustls = "0.23"
webpki-roots = "0.26"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
rust_decimal = { version = "1.34", features = ["db-tokio-postgres"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"
obfs = { path = "../obfs" }

[dev-dependencies]
tempfile = "3.10"
rust_decimal_macros = "1.34"
