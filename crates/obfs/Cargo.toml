[package]
name = "obfs"
version = "0.1.0"
edition = "2021"
description = "Optimized Binary File System for high-performance backtest artifact storage"

[dependencies]
# Zero-copy serialization
rkyv = "0.8"

# Hashing and integrity
blake3 = { version = "1.5", features = ["rayon"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Compression
zstd = "0.13"

# LMDB for metadata store
heed = { version = "0.20", features = ["read-txn-no-tls"] }

# Arrow and Parquet for columnar storage
arrow = { version = "57", features = ["ipc"] }
parquet = { version = "57", features = ["arrow", "zstd"] }

# Memory mapping
memmap2 = { workspace = true }

# Serialization helpers
serde = { workspace = true }
serde_json = { workspace = true }

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Decimal (for adapter compatibility)
rust_decimal = { version = "1.33", features = ["serde"] }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
tempfile = "3.13"

[[bench]]
name = "compression_benchmark"
harness = false

[[bench]]
name = "read_write_benchmark"
harness = false

