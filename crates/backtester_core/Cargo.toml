[package]
name = "backtester_core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core types, traits, and events for the backtester"

[features]
default = []
decimal = ["dep:rust_decimal"]
# Enable wider SIMD (f64x8) for AVX-512 capable CPUs (40-80% faster metrics)
# Requires: RUSTFLAGS="-C target-cpu=native" or explicit AVX-512 target features
simd-wide = []

[dependencies]
wide = { workspace = true }
rust_decimal = { version = "1.39", features = ["maths"], optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "core_bench"
harness = false







