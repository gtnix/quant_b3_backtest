[package]
name = "backtester_validation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Validation module for backtester outputs - sanity checks, cross-validation, and reporting"

[dependencies]
# Internal crates
backtester_reports = { workspace = true }
backtester_portfolio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# CSV handling
csv = "1.3"

# Time
chrono = { workspace = true, features = ["serde"] }

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Hashing
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"

