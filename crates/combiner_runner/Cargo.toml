[package]
name = "combiner_runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backtest execution runner for the Generative Combiner (SCG) - library/CLI integration, caching"

[features]
default = []
# Enable test utilities including BacktestOutput::mock()
# Use this feature in dev-dependencies for tests that need mock data
test-utils = []

[dependencies]
# Workspace dependencies
combiner_core = { path = "../combiner_core" }
backtester_strategy = { path = "../backtester_strategy" }
backtester_engine = { path = "../backtester_engine" }
backtester_intelligence = { path = "../backtester_intelligence" }
backtester_core = { path = "../backtester_core", features = ["decimal"] }
obfs = { path = "../obfs" }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
uuid = "1.0"
rust_decimal = { version = "1.33", features = ["serde"] }

# Local dependencies
dashmap = "6.0"
thiserror = "1.0"
tracing = "0.1"
tempfile = "3.0"
memmap2 = { workspace = true }

[dev-dependencies]

