[package]
name = "backtester_intelligence"
version = "0.1.0"
edition = "2021"
description = "Asset selection intelligence modules for backtesting"

[dependencies]
backtester_core = { path = "../backtester_core" }
backtester_execution = { path = "../backtester_execution" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = { version = "1.39", features = ["maths", "db-tokio-postgres"] }
rust_decimal_macros = "1.39"
serde_json = "1.0"
rand = "0.8"
zstd = "0.13"

# Async and database dependencies for monitoring
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = "0.12"
rustls = "0.23"
webpki-roots = "0.26"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.10"

[[bin]]
name = "monitoring_baseline"
path = "src/bin/monitoring_baseline.rs"

[[bench]]
name = "entry_bench"
harness = false

[[bench]]
name = "exit_bench"
harness = false

[[bench]]
name = "performance_bench"
harness = false

[[bench]]
name = "walkforward_bench"
harness = false
