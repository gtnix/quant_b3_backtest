[package]
name = "backtester_intelligence"
version = "0.1.0"
edition = "2021"
description = "Asset selection intelligence modules for backtesting"

[dependencies]
backtester_core = { path = "../backtester_core" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
rust_decimal = { version = "1.39", features = ["maths"] }
rust_decimal_macros = "1.39"
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "entry_bench"
harness = false

[[bench]]
name = "exit_bench"
harness = false

[[bench]]
name = "performance_bench"
harness = false

[[bench]]
name = "walkforward_bench"
harness = false




