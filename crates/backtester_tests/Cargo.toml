[package]
name = "backtester_tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Integration tests for the backtester"
publish = false

[features]
default = []
real_data = []

[dependencies]
backtester_core.workspace = true
backtester_engine.workspace = true
backtester_intelligence.workspace = true
backtester_portfolio.workspace = true
backtester_execution.workspace = true
chrono.workspace = true
