[[test]]
name = "invariants"
path = "tests/invariants.rs"

[[test]]
name = "anti_look_ahead"
path = "tests/anti_look_ahead.rs"

[[test]]
name = "real_data_integration"
path = "tests/real_data_integration.rs"

[[test]]
name = "risk_profiles_integration"
path = "tests/risk_profiles_integration.rs"

[[bench]]
name = "scenarios_bench"
harness = false

