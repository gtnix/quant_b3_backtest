[package]
name = "backtester_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for the B3 backtester"

[[bin]]
name = "backtest"
path = "src/main.rs"

[dependencies]
backtester_core.workspace = true
backtester_io.workspace = true
backtester_engine.workspace = true
backtester_portfolio.workspace = true
backtester_execution.workspace = true
backtester_reports.workspace = true
backtester_strategy.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
clap.workspace = true
chrono.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }



