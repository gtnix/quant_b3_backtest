[package]
name = "combiner_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for the Generative Combiner (SCG) - evolve, status, export commands"

[[bin]]
name = "combiner"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
combiner_core = { path = "../combiner_core" }
combiner_engine = { path = "../combiner_engine" }
combiner_runner = { path = "../combiner_runner" }
backtester_execution = { path = "../backtester_execution" }
backtester_intelligence = { path = "../backtester_intelligence" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }

# Local dependencies
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
indicatif = "0.17"
anyhow = "1.0"
rand = "0.8"
rand_chacha = "0.3"

# PostgreSQL for Strategy Factory registry (using rustls for TLS)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"

# Hashing for config/dataset
sha2 = "0.10"
hex = "0.4"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
