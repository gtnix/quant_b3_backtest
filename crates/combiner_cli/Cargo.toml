[package]
name = "combiner_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for the Generative Combiner (SCG) - evolve, status, export commands"

[[bin]]
name = "combiner"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
combiner_core = { path = "../combiner_core" }
combiner_engine = { path = "../combiner_engine" }
combiner_runner = { path = "../combiner_runner" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }

# Local dependencies
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
anyhow = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]

