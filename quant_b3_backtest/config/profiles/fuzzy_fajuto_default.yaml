# FuzzyFajuto Strategy Configuration - DEFAULT PROFILE
# Three-Attempt Execution System with ATR-Based Limit Orders
# This file contains ONLY strategy-specific parameters
# General market configuration is loaded from config/settings.yaml
#
# This is the default profile for the FuzzyFajuto strategy.
# Create additional profiles by copying this file with different names.

# Strategy-specific parameters
strategy:
  # Warmup Configuration
  # NOTE: The system intelligently calculates minimum data requirements based on:
  # - ATR period (14) + RSI period (10) + EMA periods [3,5,10,15,20] = max(20)
  # - Daily aggregation requirement: 3 days × 4 bars/day = 12 bars
  # - Quality buffer: 5 bars
  # - Total minimum: 20 + 12 + 5 = 37 bars
  # The system will automatically update warmup_bars if calculated requirement is higher
  warmup_bars: 20                  # Baseline warmup bars (will be auto-adjusted if needed)
  
  # ATR Parameters
  atr_period: 14                    # ATR calculation period (affects minimum data requirement)
  alpha_factor: 0.25               # α factor for Passive-1 orders (Open ± α·ATR)
  beta_factor: 0.50                # β factor for Passive-2 orders (Open ± β·ATR)
  # Protective minimum distances relative to Open (to avoid quasi-market limits)
  min_alpha_pct: 0.01              # 1% minimum distance for Passive-1
  min_beta_pct: 0.02               # 2% minimum distance for Passive-2
  
  # Exposure and Position Sizing
  asset_exposure_pct: 0.08         # 8% of portfolio per asset
  equal_split_attempts: true       # Split exposure equally among 3 attempts
  max_assets_per_day: 5            # Maximum number of assets to trade per day
  
  # Execution Parameters
  min_lot_size: 100                # Minimum lot size (standard)
  
  # Position Sizing and Lot Size Rounding
  lot_size_rounding: "conservative"  # conservative, aggressive, dynamic
  min_exposure_threshold: 0.5       # 50% of min_lot_size for conservative rounding
  allow_odd_lots: false             # Enforce round lots only (Brazilian market best practice)
  
  # Data Quality Settings
  min_valid_atr: 0.001             # Minimum valid ATR value (strict validation)
  max_atr_multiplier: 10.0         # Maximum ATR multiplier for safety
  require_valid_ohlc: true         # Require valid OHLC data (no fallbacks)
  skip_invalid_days: true          # Skip trading on invalid data days
  
  # Error Handling
  max_consecutive_errors: 3        # Maximum consecutive errors before stopping
  error_recovery_mode: "skip"      # skip, retry, or stop
  
  # FuzzyFajuto Signal Parameters
  buy_threshold: 1.50              # Minimum score for buy signals
  sell_threshold: -1.50            # Maximum score for sell signals
  ema_periods: [3, 5, 10, 15, 20]  # EMA periods for trend analysis (max period affects data requirement)
  rsi_period: 10                   # RSI calculation period (affects minimum data requirement)
  rsi_overbought: 65               # RSI overbought threshold
  rsi_oversold: 35                 # RSI oversold threshold
  
  # Execution Tracking
  track_executions: true           # Track all execution attempts
  log_detailed_executions: true    # Log detailed execution information
  save_execution_history: true     # Save execution history to file
  
  # Risk Management
  max_daily_loss_pct: 0.02         # 2% maximum daily loss
  max_position_size_pct: 0.10      # 10% maximum position size
  max_day_trade_exposure_pct: 0.30 # 30% maximum day trade exposure
  
  # Brazilian Market Specific
  enforce_lot_sizes: true          # Enforce Brazilian lot size rules
  enforce_price_ticks: true        # Enforce price tick normalization
  use_t_plus_2_settlement: true    # Use T+2 settlement cycle
  
  # Conservative Rounding Configuration
  # This configuration implements conservative lot size rounding to solve the "zero trades" issue:
  # - lot_size_rounding: "conservative" - Round to NEAREST lot size if raw quantity >= 50% of min_lot_size, else skip
  # - min_exposure_threshold: 0.5 - 50% threshold for conservative rounding
  # - allow_odd_lots: false - Enforce round lots only (Brazilian market best practice)
  # 
  # Example: Raw quantity 78.9 shares → 100 shares (round up)
  # Example: Raw quantity 149 shares → 100 shares (round down)
  # Example: Raw quantity 250 shares → 200 shares (round down)
  
  # Execution Simulation
  simulate_fills: true             # Simulate order fills based on High/Low
  use_moc_exit: true               # Use Market on Close for exits
  calculate_slippage: true         # Calculate effective slippage
  
  # Missing open bar handling (execution policy)
  execution:
    missing_open_bar_behavior: "skip_day"   # options: skip_day, use_first_available, alert_only
  
  # Performance Tracking
  track_fill_rates: true           # Track fill rates by attempt type
  track_pnl_by_attempt: true       # Track PnL by execution attempt
  track_exposure_utilization: true # Track exposure utilization
  
  # Reporting
  generate_execution_reports: true # Generate detailed execution reports
  include_atr_analysis: true       # Include ATR analysis in reports
  include_fill_rate_analysis: true # Include fill rate analysis in reports

# Execution Attempt Configuration
execution_attempts:
  attempt_1:
    name: "Market Order at Open"
    order_type: "MARKET"
    execution_price: "OPEN"
    priority: 1
    description: "Immediate execution at daily market open (10:00 AM only)"
    
  attempt_2:
    name: "Limit Order Passive-1"
    order_type: "LIMIT"
    execution_price: "OPEN ± α·ATR"
    priority: 2
    description: "Limit order at Open ± 0.25·ATR"
    
  attempt_3:
    name: "Limit Order Passive-2"
    order_type: "LIMIT"
    execution_price: "OPEN ± β·ATR"
    priority: 3
    description: "Limit order at Open ± 0.50·ATR"

# ATR Calculation Details - Using Brapi.dev Daily Data
atr_calculation:
  method: "brapi_daily_direct"     # ATR from Brapi.dev daily data directly
  true_range_formula: "max(High-Low, |High-Close_prev|, |Low-Close_prev|)"
  lookbook_period: 14              # Period for ATR calculation
  data_source: "brapi_daily"       # Source: Brapi.dev daily API
  no_aggregation: true             # No intraday aggregation needed

# Performance Metrics Configuration
performance_metrics:
  calculate_daily:
    - "fill_rate"
    - "total_pnl"
    - "exposure_utilization"
    - "slippage_analysis"
    - "atr_volatility"
    
  calculate_summary:
    - "overall_fill_rate"
    - "total_return"
    - "sharpe_ratio"
    - "max_drawdown"
    - "win_rate"
    - "profit_factor"
    
  execution_analysis:
    - "fill_rates_by_attempt_type"
    - "pnl_by_attempt_type"
    - "exposure_efficiency"
    - "volatility_impact"
    - "timing_analysis"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/enhanced_fuzzy_fajuto.log"
  max_file_size: "10MB"
  backup_count: 5
  
  log_executions: true
  log_signals: true
  log_trades: true
  log_performance: true
  log_errors: true 