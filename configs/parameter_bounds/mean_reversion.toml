# =============================================================================
# Parameter Bounds - Mean Reversion Family
# =============================================================================

[metadata]
family = "mean_reversion"
version = "1.0.0"
description = "Parameter bounds for mean reversion strategies"

# Bollinger Bands Parameters
[parameters.bb_period]
type = "integer"
min = 10
max = 50
step = 5
default = 20
description = "Bollinger Bands SMA period"

[parameters.bb_std_dev]
type = "float"
min = 1.5
max = 3.0
step = 0.25
default = 2.0
description = "Bollinger Bands standard deviation multiplier"

[parameters.bb_entry_band]
type = "enum"
values = ["lower", "upper", "both"]
default = "both"
description = "Which band triggers entry"

[parameters.bb_exit_method]
type = "enum"
values = ["middle", "opposite", "time"]
default = "middle"
description = "Exit method for BB strategy"

# RSI Parameters
[parameters.rsi_period]
type = "integer"
min = 7
max = 21
step = 2
default = 14
description = "RSI calculation period"

[parameters.rsi_oversold]
type = "integer"
min = 15
max = 35
step = 5
default = 30
description = "RSI oversold threshold for long entry"

[parameters.rsi_overbought]
type = "integer"
min = 65
max = 85
step = 5
default = 70
description = "RSI overbought threshold for short entry"

[parameters.rsi_exit_level]
type = "integer"
min = 45
max = 55
step = 5
default = 50
description = "RSI level for exit"

# Stochastic Parameters
[parameters.stoch_k_period]
type = "integer"
min = 5
max = 21
step = 2
default = 14
description = "Stochastic %K period"

[parameters.stoch_d_period]
type = "integer"
min = 2
max = 7
step = 1
default = 3
description = "Stochastic %D smoothing period"

[parameters.stoch_oversold]
type = "integer"
min = 10
max = 30
step = 5
default = 20
description = "Stochastic oversold level"

[parameters.stoch_overbought]
type = "integer"
min = 70
max = 90
step = 5
default = 80
description = "Stochastic overbought level"

# Trend Filter
[parameters.trend_filter_enabled]
type = "boolean"
default = true
description = "Enable trend filter"

[parameters.trend_filter_ma]
type = "integer"
min = 20
max = 200
step = 10
default = 50
description = "Moving average period for trend filter"

[parameters.trade_with_trend_only]
type = "boolean"
default = true
description = "Only trade in direction of trend"

# Z-Score Mean Reversion
[parameters.zscore_lookback]
type = "integer"
min = 10
max = 60
step = 5
default = 20
description = "Lookback for z-score calculation"

[parameters.zscore_entry]
type = "float"
min = 1.5
max = 3.0
step = 0.25
default = 2.0
description = "Z-score threshold for entry"

[parameters.zscore_exit]
type = "float"
min = 0.0
max = 1.0
step = 0.25
default = 0.5
description = "Z-score threshold for exit"

# Risk Management
[parameters.stop_loss_pct]
type = "float"
min = 0.02
max = 0.1
step = 0.01
default = 0.05
description = "Stop loss as percentage"

[parameters.take_profit_pct]
type = "float"
min = 0.02
max = 0.15
step = 0.01
default = 0.08
description = "Take profit as percentage"

[parameters.max_holding_days]
type = "integer"
min = 2
max = 15
step = 1
default = 7
description = "Maximum holding period in days"

[parameters.position_size_pct]
type = "float"
min = 0.02
max = 0.15
step = 0.01
default = 0.05
description = "Position size as portfolio percentage"




