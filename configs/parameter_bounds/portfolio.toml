# =============================================================================
# Parameter Bounds - Portfolio Family
# =============================================================================

[metadata]
family = "portfolio"
version = "1.0.0"
description = "Parameter bounds for portfolio trading strategies"

# Number of Assets
[parameters.num_assets]
type = "integer"
min = 5
max = 50
step = 5
default = 10
description = "Number of assets in portfolio"

[parameters.min_assets]
type = "integer"
min = 3
max = 10
step = 1
default = 5
description = "Minimum number of assets required"

# Rebalancing
[parameters.rebalance_frequency]
type = "enum"
values = ["daily", "weekly", "bi_weekly", "monthly", "quarterly"]
default = "monthly"
description = "Portfolio rebalancing frequency"

[parameters.rebalance_threshold]
type = "float"
min = 0.01
max = 0.1
step = 0.01
default = 0.05
description = "Minimum drift to trigger rebalancing"

# Equal Weight Specific
[parameters.equal_weight_cap]
type = "float"
min = 0.05
max = 0.25
step = 0.05
default = 0.1
description = "Maximum weight per asset for equal weight"

# Risk Parity Specific
[parameters.target_volatility]
type = "float"
min = 0.05
max = 0.25
step = 0.025
default = 0.1
description = "Target portfolio volatility (annualized)"

[parameters.volatility_lookback]
type = "integer"
min = 20
max = 126
step = 21
default = 63
description = "Lookback for volatility estimation"

[parameters.correlation_lookback]
type = "integer"
min = 60
max = 252
step = 21
default = 126
description = "Lookback for correlation estimation"

[parameters.leverage_limit]
type = "float"
min = 1.0
max = 3.0
step = 0.25
default = 1.0
description = "Maximum portfolio leverage"

# Minimum Variance Specific
[parameters.min_weight]
type = "float"
min = 0.0
max = 0.05
step = 0.01
default = 0.0
description = "Minimum weight per asset"

[parameters.max_weight]
type = "float"
min = 0.1
max = 0.5
step = 0.05
default = 0.25
description = "Maximum weight per asset"

[parameters.covariance_shrinkage]
type = "float"
min = 0.0
max = 1.0
step = 0.1
default = 0.5
description = "Ledoit-Wolf shrinkage intensity"

[parameters.allow_short]
type = "boolean"
default = false
description = "Allow short positions"

# Maximum Sharpe Specific
[parameters.risk_free_rate]
type = "float"
min = 0.0
max = 0.15
step = 0.01
default = 0.03
description = "Risk-free rate for Sharpe calculation"

[parameters.expected_return_method]
type = "enum"
values = ["historical", "capm", "factor_model"]
default = "historical"
description = "Method for expected return estimation"

[parameters.return_lookback]
type = "integer"
min = 60
max = 504
step = 21
default = 252
description = "Lookback for return estimation"

# Universe Selection
[parameters.liquidity_threshold]
type = "float"
min = 100000
max = 10000000
step = 100000
default = 1000000
description = "Minimum daily volume in BRL"

[parameters.market_cap_percentile]
type = "float"
min = 0.0
max = 0.5
step = 0.1
default = 0.0
description = "Minimum market cap percentile"

# Risk Constraints
[parameters.max_sector_weight]
type = "float"
min = 0.2
max = 0.5
step = 0.05
default = 0.3
description = "Maximum weight per sector"

[parameters.max_drawdown_trigger]
type = "float"
min = 0.1
max = 0.3
step = 0.05
default = 0.2
description = "Drawdown level to trigger risk reduction"

[parameters.turnover_limit]
type = "float"
min = 0.1
max = 1.0
step = 0.1
default = 0.5
description = "Maximum monthly turnover"




