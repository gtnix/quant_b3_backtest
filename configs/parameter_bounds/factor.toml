# =============================================================================
# Parameter Bounds - Factor Investing Family
# =============================================================================

[metadata]
family = "factor"
version = "1.0.0"
description = "Parameter bounds for factor investing strategies"

# Value Factor Parameters
[parameters.pe_percentile]
type = "integer"
min = 10
max = 40
step = 5
default = 25
description = "P/E percentile cutoff for value stocks"

[parameters.pb_percentile]
type = "integer"
min = 10
max = 40
step = 5
default = 25
description = "P/B percentile cutoff for value stocks"

[parameters.ev_ebitda_percentile]
type = "integer"
min = 10
max = 40
step = 5
default = 25
description = "EV/EBITDA percentile cutoff"

[parameters.value_composite]
type = "boolean"
default = true
description = "Use composite value score"

# Quality Factor Parameters
[parameters.roe_percentile]
type = "integer"
min = 60
max = 90
step = 5
default = 75
description = "ROE percentile cutoff for quality"

[parameters.roic_percentile]
type = "integer"
min = 60
max = 90
step = 5
default = 75
description = "ROIC percentile cutoff"

[parameters.debt_equity_max]
type = "float"
min = 0.5
max = 2.0
step = 0.25
default = 1.0
description = "Maximum debt/equity ratio"

[parameters.profit_margin_min]
type = "float"
min = 0.05
max = 0.20
step = 0.025
default = 0.1
description = "Minimum profit margin"

[parameters.quality_composite]
type = "boolean"
default = true
description = "Use composite quality score"

# Low Volatility Factor
[parameters.vol_lookback]
type = "integer"
min = 60
max = 252
step = 21
default = 126
description = "Volatility lookback period"

[parameters.vol_percentile]
type = "integer"
min = 10
max = 40
step = 5
default = 30
description = "Volatility percentile cutoff"

[parameters.beta_max]
type = "float"
min = 0.5
max = 1.0
step = 0.1
default = 0.8
description = "Maximum beta for low vol stocks"

# Size Factor
[parameters.size_factor_enabled]
type = "boolean"
default = false
description = "Include size factor"

[parameters.market_cap_percentile]
type = "integer"
min = 0
max = 50
step = 10
default = 30
description = "Market cap percentile for small cap"

# Multi-Factor Parameters
[parameters.factor_weights_value]
type = "float"
min = 0.0
max = 1.0
step = 0.1
default = 0.25
description = "Weight for value factor"

[parameters.factor_weights_momentum]
type = "float"
min = 0.0
max = 1.0
step = 0.1
default = 0.25
description = "Weight for momentum factor"

[parameters.factor_weights_quality]
type = "float"
min = 0.0
max = 1.0
step = 0.1
default = 0.25
description = "Weight for quality factor"

[parameters.factor_weights_low_vol]
type = "float"
min = 0.0
max = 1.0
step = 0.1
default = 0.25
description = "Weight for low volatility factor"

[parameters.factor_normalization]
type = "enum"
values = ["zscore", "rank", "minmax"]
default = "zscore"
description = "Factor score normalization method"

# Rebalancing
[parameters.rebalance_frequency]
type = "enum"
values = ["monthly", "quarterly", "semi_annual", "annual"]
default = "quarterly"
description = "Factor portfolio rebalancing frequency"

[parameters.turnover_constraint]
type = "float"
min = 0.1
max = 0.5
step = 0.1
default = 0.25
description = "Maximum quarterly turnover"

# Portfolio Construction
[parameters.num_stocks]
type = "integer"
min = 10
max = 50
step = 10
default = 30
description = "Number of stocks in portfolio"

[parameters.max_stock_weight]
type = "float"
min = 0.02
max = 0.1
step = 0.02
default = 0.05
description = "Maximum weight per stock"

[parameters.sector_neutral]
type = "boolean"
default = false
description = "Maintain sector neutral weights"




