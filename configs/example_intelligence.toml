# Example Intelligence Configuration
# Asset selection filters that can be enabled/combined in any strategy

[data]
source = "neon"
sync_before_backtest = true
max_data_age_hours = 24

[asset_filters]
enabled = true
mode = "score"  # "intersection" | "score" | "cascade"
top_percentile = 20
rebalance_frequency = "weekly"

[asset_filters.momentum]
enabled = true
weight = 0.25
lookback_days = 126
min_return = 0.0
skip_last_days = 21

[asset_filters.value]
enabled = true
weight = 0.20
max_pe = 15.0
max_pb = 2.0
min_pe = 0.0

[asset_filters.quality]
enabled = true
weight = 0.20
min_roe = 0.12
max_debt_equity = 1.0
min_profit_margin = 0.05

[asset_filters.low_vol]
enabled = true
weight = 0.15
lookback_days = 60
max_annualized_vol = 0.30

[asset_filters.dividend_yield]
enabled = false
weight = 0.10
min_yield = 0.03
max_yield = 0.15

[asset_filters.size]
enabled = true
weight = 0.10
min_market_cap = 5_000_000_000  # R$ 5 bi
# max_market_cap = null  # No limit






