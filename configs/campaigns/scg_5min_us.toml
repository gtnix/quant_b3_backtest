# =============================================================================
# SCG 5-Minute US Campaign (S&P 500)
# =============================================================================
# Mercado US com dados do Neon (522 símbolos S&P 500, 2005-2026)
# =============================================================================

[campaign]
name = "scg_5min_us"
description = "5-minute US S&P 500 strategy discovery"
version = "1.0.0"

[dataset]
market = "US"
data_source = "database"  # Usar Neon database

[risk_profile]
name = "arrojado"

[evolution]
population_size = 200
max_generations = 500
tournament_size = 3
crossover_rate = 0.85
elitism_rate = 0.10
mutation_rate = 0.08
convergence_generations = 25  # Mais gerações antes de convergir
max_runtime_seconds = 300     # 5 minutos
workers = 14
hall_of_fame_size = 50

[diversity]
enabled = true
sigma_share = 0.10
sharing_alpha = 1.0
fitness_sharing = true
phenotypic_distance = true
critical_threshold = 0.15

[adaptation]
enabled = true
base_mutation_rate = 0.08
min_mutation_rate = 0.01
max_mutation_rate = 0.35
amplification_factor = 2.0

[stagnation]
detection_enabled = true
window_size = 10
improvement_threshold = 0.003
restart_enabled = true
restart_elite_ratio = 0.20
post_restart_boost_generations = 5
max_restarts = 5

[execution]
mode = "fast"
has_costs = true
slippage_bps = 5.0      # US tem menor slippage
commission_bps = 1.0    # Comissão mais baixa US
emolument_bps = 0.0     # Sem emolumentos
market_impact_model = "linear"

[validation]
enabled = true
top_k = 20
wfa_enabled = true
wfa_num_folds = 3
wfa_is_ratio = 0.6
wfa_purge_days = 5
pbo_enabled = false
stress_enabled = true
stress_min_pass = 3

[gates]
gates_required = true
min_oos_sharpe_net = 0.40
max_pbo = 0.20
min_stress_passed = 3
max_degradation = 0.45
min_oos_trades = 25

[data_integrity]
enabled = true
lookback_requirements = true
survivorship_bias_check = true

[metrics]
objectives = ["sharpe_ratio", "cagr", "max_drawdown"]
sharpe_weight = 1.5
cagr_weight = 1.0
drawdown_weight = 1.0
calmar_weight = 0.5
sortino_weight = 0.5
low_trades_penalty = true
min_trades = 20
extreme_turnover_penalty = true
max_turnover_annual = 600.0
high_volatility_penalty = true
max_volatility = 0.35

[output]
artifact_format = "obfs"
save_generations = true
save_all_genomes = false
save_diversity_metrics = true
save_restart_events = true

