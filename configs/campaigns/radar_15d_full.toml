# =============================================================================
# Radar 15 Dias - Full Power (até 18h)
# =============================================================================
# Campanha intensiva usando mais recursos da máquina
# Duração: até 18:00 (~8h45min)
# =============================================================================

[campaign]
name = "radar_15d_full"
description = "Radar 15 dias - campanha intensiva BR"
version = "1.0.0"

[dataset]
market = "BR"
market_data_path = "data/market_data_ibov.csv"
initial_capital = 100000.0

[risk_profile]
name = "moderado"

[evolution]
population_size = 200
max_generations = 5000
tournament_size = 4
crossover_rate = 0.88
elitism_rate = 0.10
mutation_rate = 0.08
convergence_generations = 50
max_runtime_seconds = 27000    # até 18:00
workers = 4                     # 25% CPU
hall_of_fame_size = 50

[diversity]
enabled = true
sigma_share = 0.15
sharing_alpha = 2.0
fitness_sharing = true
phenotypic_distance = true
critical_threshold = 0.20
crowding_factor = 4

[adaptation]
enabled = true
base_mutation_rate = 0.06
min_mutation_rate = 0.01
max_mutation_rate = 0.35
amplification_factor = 2.5

[stagnation]
detection_enabled = true
window_size = 15
improvement_threshold = 0.003
restart_enabled = true
restart_elite_ratio = 0.15
post_restart_boost_generations = 8
max_restarts = 10

[execution]
mode = "compiled"
has_costs = true
allow_short = true
slippage_bps = 8.0
commission_bps = 3.0
emolument_bps = 1.5
market_impact_model = "linear"

[validation]
enabled = true
top_k = 25
wfa_enabled = true
wfa_num_folds = 5
wfa_is_ratio = 0.6
wfa_purge_days = 5
pbo_enabled = true
pbo_significance_level = 0.05
stress_enabled = true
stress_min_pass = 4

[gates]
gates_required = true
min_oos_sharpe_net = 0.35
max_pbo = 0.25
min_stress_passed = 4
max_degradation = 0.45
min_oos_trades = 15
max_drawdown = -0.30

[data_integrity]
enabled = true
lookback_requirements = true
survivorship_bias_check = true

[metrics]
objectives = ["sharpe_ratio", "cagr", "max_drawdown"]
sharpe_weight = 1.8
cagr_weight = 1.2
drawdown_weight = 3.0
calmar_weight = 1.2
sortino_weight = 0.6
low_trades_penalty = true
min_trades = 15
extreme_turnover_penalty = true
max_turnover_annual = 600.0
high_volatility_penalty = true
max_volatility = 0.40
drawdown_penalty_threshold = -0.20

[output]
artifact_format = "obfs"
save_generations = true
save_all_genomes = false
save_diversity_metrics = true
save_restart_events = true
