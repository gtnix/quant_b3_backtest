# =============================================================================
# SCG 5-Minute Test Campaign
# =============================================================================
# Quick test to verify Hall of Fame auto-promotion in Rust
# =============================================================================

[campaign]
name = "scg_5min_test"
description = "5-minute test with Rust-native Hall of Fame promotion"
version = "1.0.0"

[dataset]
market = "BR"
market_data_path = "data/market_data_ibov.csv"

[risk_profile]
name = "arrojado"

[evolution]
population_size = 100
max_generations = 50
tournament_size = 3
crossover_rate = 0.85
elitism_rate = 0.10
mutation_rate = 0.05
convergence_generations = 10
max_runtime_seconds = 300
workers = 0
hall_of_fame_size = 25

[diversity]
enabled = true
sigma_share = 0.10
sharing_alpha = 1.0
fitness_sharing = true
phenotypic_distance = true
critical_threshold = 0.15

[adaptation]
enabled = true
base_mutation_rate = 0.05
min_mutation_rate = 0.01
max_mutation_rate = 0.30
amplification_factor = 2.0

[stagnation]
detection_enabled = true
window_size = 10
improvement_threshold = 0.005
restart_enabled = true
restart_elite_ratio = 0.20
post_restart_boost_generations = 5
max_restarts = 3

[execution]
mode = "compiled"
has_costs = true
slippage_bps = 10.0
commission_bps = 5.0
emolument_bps = 2.5
market_impact_model = "linear"

[validation]
enabled = true
top_k = 10
wfa_enabled = true
wfa_num_folds = 5
wfa_is_ratio = 0.6
wfa_purge_days = 5
pbo_enabled = true
pbo_significance_level = 0.05
stress_enabled = true
stress_min_pass = 4

[gates]
gates_required = true
min_oos_sharpe_net = 0.50
max_pbo = 0.15
min_stress_passed = 4
max_degradation = 0.40
min_oos_trades = 30

[data_integrity]
enabled = true
lookback_requirements = true
survivorship_bias_check = true

[metrics]
objectives = ["sharpe_ratio", "cagr", "max_drawdown"]
sharpe_weight = 1.5
cagr_weight = 1.0
drawdown_weight = 1.0
calmar_weight = 0.5
sortino_weight = 0.5
low_trades_penalty = true
min_trades = 30
extreme_turnover_penalty = true
max_turnover_annual = 500.0
high_volatility_penalty = true
max_volatility = 0.40

[output]
artifact_format = "obfs"
save_generations = true
save_all_genomes = false
save_diversity_metrics = true
save_restart_events = true


