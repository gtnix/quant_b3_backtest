# 45 Minute Full Audit Campaign
# Uso: combiner factory run --campaign configs/campaigns/scg_45min_audit.toml

[campaign]
name = "scg_45min_audit"
tag = "full-audit"
owner = "bahuan"
notes = "45 minute parallel audit - local vs VPS comparison"

[dataset]
market = "BR"
start_date = "2020-01-01"
end_date = "2024-12-01"
universe = "ibov"
market_data_path = "data/market_data_ibov.csv"

[evolution]
population_size = 300
max_generations = 100

[execution]
config_path = "configs/execution_institutional.toml"

[seeds]
count = 3
base_seed = 2026

[budget]
max_runs = 3
top_k = 30
timeout_per_run_secs = 900
stress_enabled = true

[promotion]
min_oos_sharpe_net = 0.5
max_pbo = 0.15
min_stress_passed = 3
gates_required = true

[data_integrity]
mode = "full"
enabled = true

