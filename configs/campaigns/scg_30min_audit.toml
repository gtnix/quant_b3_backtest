# 30 Minute Audit Campaign - Maximum Resources
# Uso: combiner factory run --campaign configs/campaigns/scg_30min_audit.toml

[campaign]
name = "scg_30min_audit"
tag = "audit"
owner = "bahuan"
notes = "30 minute full audit campaign with maximum resources"

[dataset]
market = "BR"
start_date = "2020-01-01"
end_date = "2024-12-01"
universe = "ibov"
market_data_path = "data/market_data_ibov.csv"

[evolution]
population_size = 300
max_generations = 100

[execution]
config_path = "configs/execution_institutional.toml"

[seeds]
count = 5
base_seed = 42

[budget]
max_runs = 5
top_k = 30
timeout_per_run_secs = 360
stress_enabled = true

[promotion]
min_oos_sharpe_net = 0.5
max_pbo = 0.15
min_stress_passed = 3
gates_required = true

[data_integrity]
mode = "full"
enabled = true

