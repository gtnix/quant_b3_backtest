# Quick Test Campaign - 30 segundos
# Uso: combiner factory run --campaign configs/campaigns/scg_quick_test.toml

[campaign]
name = "scg_quick_test"
tag = "test"
owner = "debug"
notes = "Quick 30s test for E2E validation"

[dataset]
market = "BR"
start_date = "2020-01-01"
end_date = "2024-12-01"
universe = "ibov"

[evolution]
population_size = 20
max_generations = 5

[execution]
config_path = "configs/execution_institutional.toml"

[seeds]
count = 1
base_seed = 42

[budget]
max_runs = 1
top_k = 5
timeout_per_run_secs = 30
stress_enabled = false

[promotion]
min_oos_sharpe_net = 0.3
max_pbo = 0.25
min_stress_passed = 0
gates_required = false

[data_integrity]
mode = "fast"
enabled = false

