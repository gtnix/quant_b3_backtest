# Strategy Factory Campaign Configuration - BLAST 1000
# Purpose: Generate >= 1000 research candidates (Stage A) for Top 1000 validation
#
# This config prioritizes volume over validation:
# - Large population + many generations = many unique genomes
# - persist_stage_a_top_n = 1000 to capture top research candidates
# - Stage B validation only for top 50
# - Stress testing disabled for speed

[campaign]
name = "scg_blast_1000"
tag = "blast"
owner = "quant_platform"
notes = "Blast run to generate >= 1000 research candidates for Top 1000 export"

[dataset]
market = "BR"
start_date = "2022-01-01"
end_date = "2024-06-01"
universe = "ibov"

[evolution]
# Large population to generate diversity
population_size = 200
# Many generations to accumulate unique genomes
max_generations = 50
# Longer convergence window
convergence_generations = 15

[execution]
config_path = "configs/execution_institutional.toml"
delay_bars = 1

[seeds]
count = 1                   # Single seed for blast
base_seed = 42

[budget]
max_runs = 1
# Stage B: validate only top 50 (expensive)
top_k = 50
# Stage A: persist top 100 research candidates (reduce disk usage)
persist_stage_a_top_n = 100
# 10 minute timeout
timeout_per_run_secs = 600
# Disable stress for speed
stress_enabled = false

[promotion]
min_oos_sharpe_net = 0.3
max_pbo = 0.25
min_stress_passed = 0
gates_required = false

[data_integrity]
mode = "fast"
max_gap_days = 5
jump_threshold_pct = 25.0
price_adjustment = "adjusted"
universe_type = "static"
enabled = true



