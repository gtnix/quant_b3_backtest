# 5 Minute Max Power Test
# Uso: combiner factory run --campaign configs/campaigns/scg_5min_maxpower.toml

[campaign]
name = "scg_5min_maxpower"
tag = "audit"
owner = "bahuan"
notes = "5 minute test with maximum resources for validation"

[dataset]
market = "BR"
start_date = "2020-01-01"
end_date = "2024-12-01"
universe = "ibov"
market_data_path = "data/market_data_ibov.csv"

[evolution]
population_size = 200
max_generations = 50

[execution]
config_path = "configs/execution_institutional.toml"

[seeds]
count = 3
base_seed = 42

[budget]
max_runs = 1
top_k = 20
timeout_per_run_secs = 300
stress_enabled = true

[promotion]
min_oos_sharpe_net = 0.5
max_pbo = 0.15
min_stress_passed = 3
gates_required = true

[data_integrity]
mode = "full"
enabled = true


