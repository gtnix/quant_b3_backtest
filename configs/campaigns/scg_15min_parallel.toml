# 15 Minute Parallel Test - Local vs VPS
# Uso: combiner factory run --campaign configs/campaigns/scg_15min_parallel.toml

[campaign]
name = "scg_15min_parallel"
tag = "parallel-test"
owner = "bahuan"
notes = "15 minute parallel test to compare local vs VPS execution"

[dataset]
market = "BR"
start_date = "2020-01-01"
end_date = "2024-12-01"
universe = "ibov"
market_data_path = "data/market_data_ibov.csv"

[evolution]
population_size = 200
max_generations = 80

[execution]
config_path = "configs/execution_institutional.toml"

[seeds]
count = 2
base_seed = 100

[budget]
max_runs = 2
top_k = 25
timeout_per_run_secs = 450
stress_enabled = true

[promotion]
min_oos_sharpe_net = 0.5
max_pbo = 0.15
min_stress_passed = 3
gates_required = true

[data_integrity]
mode = "full"
enabled = true

