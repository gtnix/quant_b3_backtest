# Backtest with real historical data from Brapi

[general]
name = "real_data_backtest"
initial_capital = 100000.0

[data]
path = "data/portfolio_historical.csv"
skip_invalid = true

[strategy]
type = "trend"
short_period = 5
long_period = 20

[execution]
slippage_type = "constant"
slippage_param = 0.5
fixed_cost = 5.0
proportional_bps = 5.0
max_participation = 0.05
allow_partial = true






























