# Moderado Risk Profile (Default)
# Balanced growth accepting short-term volatility.
#
# Target: Maximize geometric growth near Half-Kelly.
# Expected Max Drawdown: 20%
# Daily Loss Limit: 2.5%
# Weekly Loss Limit: 6%
#
# Academic Basis:
# - Kelly fraction 0.4-0.5 (near Half-Kelly) per Thorp (2006)
# - Risk per trade 1.0-1.5% per Chan (2021)
# - ATR multiplier 2.0-3.0x per Chan (2013)

[profile]
name = "Moderado"
market_adjustments = true

[sizing]
kelly_fraction = 0.40            # Near Half-Kelly
max_risk_per_trade_pct = 0.0125  # 1.25%
max_exposure_per_asset_pct = 0.20
max_sector_concentration_pct = 0.35
max_positions = 20
min_position_weight = 0.02

[stops]
stop_type = "ATR"
atr_period = 14
atr_multiplier_br = 2.50
atr_multiplier_us = 2.10
fixed_stop_pct = 0.12
enable_trailing = true
trailing_activation_pct = 0.10
trailing_atr_multiplier = 2.00

[portfolio_risk]
volatility_target_br = 0.16
volatility_target_us = 0.12
max_drawdown_pct = -0.20         # 20% max DD (industry standard)
max_leverage = 1.0
cvar_limit_95 = -0.035

[circuit_breakers]
daily_loss_limit_pct = -0.025    # -2.5%
weekly_loss_limit_pct = -0.06    # -6%
monthly_loss_limit_pct = -0.12
drawdown_action = "ReduceRisk"
cooldown_days = 1

[operational]
min_liquidity_usd_br = 5000000
min_liquidity_usd_us = 20000000
max_spread_bps_br = 30
max_spread_bps_us = 15
slippage_cost_bps = 10
commission_rate = 0.001
max_participation_rate = 0.05

[universe_filters]
min_market_cap_br = 500000000    # R$ 500M
min_market_cap_us = 2000000000   # $2B
max_annualized_vol = 0.50
min_dividend_yield = -0.02
min_momentum_return = 0.0
use_quantile_thresholds = true
top_quantile = 0.20

# =============================================================================
# Universe Restrictions for Parameter Universe System
# =============================================================================
[universe_restrictions]
# Allowed strategy families for this risk profile
allowed_strategy_families = ["swing", "position", "pair", "portfolio", "momentum", "mean_reversion", "breakout", "sector_rotation", "factor", "volatility", "event_driven", "buy_hold", "multi_strategy"]

# Maximum parameters the GA can optimize
max_parameters_to_optimize = 10

# Allowed complexity tiers
allowed_complexity_tiers = ["tier1_fast", "tier2_medium"]

# Evolution limits
max_population_size = 200
max_generations = 150

# Validation strictness
min_wfa_folds = 5
min_pbo_permutations = 500
max_pbo_threshold = 0.30

# =============================================================================
# Stress Testing (moderado = balanced thresholds)
# =============================================================================
[stress]
enabled = true
min_pass = 3                        # 3 de 5 cenários
scenarios = ["costs_2x", "delay_plus1", "spread_widen_vol", "capacity_constraint", "flash_crash"]

[stress.thresholds]
max_sharpe_degradation = 0.50       # Permite até 50% de degradação
max_dd_increase = 0.30              # Permite até 30% de aumento no DD
min_survival_rate = 0.70            # 70% sobrevivência mínima


