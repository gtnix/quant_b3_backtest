# =============================================================================
# SCG (System Combiner Generativo) Configuration
# =============================================================================
# This configuration file controls the evolutionary strategy discovery process.

[evolution]
# Population size per generation
population_size = 100

# Maximum number of generations
max_generations = 50

# Tournament size for selection (higher = more selective)
tournament_size = 3

# Crossover probability (0.0 - 1.0)
crossover_rate = 0.85

# Mutation probability per gene (0.0 - 1.0)
mutation_rate = 0.10

# Elitism rate (fraction of population preserved unchanged)
elitism_rate = 0.10

# Random seed for reproducibility (comment out for random seed)
seed = 42

# Stop early if Pareto frontier doesn't change for N generations
convergence_generations = 10

# Maximum runtime in seconds (0 = unlimited)
max_runtime_seconds = 0

# Number of parallel backtest workers (default: num CPUs)
workers = 8

# Hall of Fame size (best strategies to keep)
hall_of_fame_size = 25

[output]
# Output directory for results
directory = "output/scg"

# Save all generations (can use lots of disk space)
save_all_generations = false

# Save population every N generations
save_interval = 5

