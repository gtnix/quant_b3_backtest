# Look-Ahead Validation Config
# Uses flat data with single spike - any profit indicates look-ahead bias

[general]
name = "lookahead_validation"
initial_capital = 100000.0

[data]
path = "data/lookahead_trap.csv"
skip_invalid = true

[strategy]
type = "trend"
short_period = 5
long_period = 10

[execution]
slippage_type = "none"
fixed_cost = 0.0
proportional_bps = 0.0


















