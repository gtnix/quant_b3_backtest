# =============================================================================
# MODALITY GROUPINGS
# =============================================================================

[modalities.by_position_type]
directional = ["intraday", "swing", "position", "momentum", "mean_reversion", "breakout", "seasonal", "volatility", "event_driven"]
market_neutral = ["pair"]
portfolio = ["portfolio", "sector_rotation", "factor", "buy_hold", "multi_strategy"]

[modalities.by_holding_horizon]
ultra_short = ["intraday"]  # Hours
short = ["swing", "mean_reversion"]  # Days
medium = ["position", "pair", "momentum", "breakout", "volatility", "event_driven"]  # Weeks
long = ["portfolio", "sector_rotation", "factor", "seasonal", "buy_hold", "multi_strategy"]  # Months+

[modalities.by_hypothesis]
trend_following = ["swing", "position", "momentum", "breakout"]
contrarian = ["mean_reversion", "volatility"]
statistical = ["pair"]
fundamental = ["factor", "buy_hold"]
tactical = ["sector_rotation", "seasonal", "event_driven"]
hybrid = ["multi_strategy", "portfolio"]
opportunistic = ["intraday"]

[modalities.by_complexity]
simple = ["intraday", "swing", "mean_reversion", "breakout", "buy_hold"]
moderate = ["position", "pair", "momentum", "sector_rotation", "seasonal", "volatility", "event_driven"]
complex = ["portfolio", "factor", "multi_strategy"]

[modalities.by_data_requirement]
price_only = ["intraday", "swing", "mean_reversion", "breakout", "momentum"]
price_volume = ["intraday", "pair", "volatility"]
fundamental = ["position", "factor", "buy_hold"]
economic = ["sector_rotation", "seasonal"]
all_data = ["portfolio", "multi_strategy", "event_driven"]

# =============================================================================
# FAMILY COMPATIBILITY MATRIX
# =============================================================================
# Which families can be combined in multi-strategy approaches

[compatibility.combinable]
# Families that work well together
momentum_mean_reversion = ["momentum", "mean_reversion"]
trend_range = ["swing", "breakout", "mean_reversion"]
factor_portfolio = ["factor", "portfolio"]
tactical_core = ["buy_hold", "sector_rotation"]

[compatibility.exclusive]
# Families that should NOT be combined
intraday = ["position", "factor", "buy_hold", "seasonal"]  # Timeframe conflict
buy_hold = ["intraday", "swing"]  # Philosophy conflict


