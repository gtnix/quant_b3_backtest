# =============================================================================
# Trading Modalities - Universe-Only System
# =============================================================================
# Maps the 15 strategy families to trading modalities, hypotheses, and 
# business characteristics.
# =============================================================================

[metadata]
version = "1.0.0"
last_updated = "2026-01-06"
total_families = 15
description = "Trading modality definitions for all strategy families"

# =============================================================================
# FAMILY DEFINITIONS
# =============================================================================

[families.intraday]
id = "intraday"
label = "Intraday Trading"
description = "Estratégias executadas dentro de um único dia usando barras de 1 hora"
icon = "⚡"
color = "#FF6B6B"

# Trading characteristics
timeframe = "1h"
holding_period = { min_hours = 1, max_hours = 8 }
data_frequency = "hourly"
data_window_months = 6

# Market hypothesis
hypotheses = ["breakout", "momentum", "mean_reversion"]
position_type = "directional"

# Complexity and resources
complexity_tier = "tier1_fast"
typical_trades_per_year = 200

# Risk profile compatibility
compatible_risk_profiles = ["moderado", "arrojado", "muito_arrojado"]

# Sub-strategies
variants = [
    "orb_breakout",
    "vwap_trading",
    "mean_reversion_rsi",
    "mean_reversion_bb",
    "momentum_macd",
    "momentum_adx",
    "gap_trading",
    "volume_profile",
    "news_based"
]

