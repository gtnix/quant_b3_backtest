# =============================================================================
# REGIME DETECTION CONFIGURATION
# =============================================================================

[regime_detection]
enabled = true
lookback_days = 20
update_frequency = "daily"

[regime_detection.indicators]
primary = "atr_percentile"
secondary = ["bb_width_percentile", "realized_vol_percentile"]
confirmation_required = 2  # Need 2 of 3 to confirm regime change

[regime_detection.atr_percentile]
period = 14
percentile_lookback = 252  # 1 year

[regime_detection.bb_width_percentile]
period = 20
std_dev = 2.0
percentile_lookback = 252

[regime_detection.realized_vol_percentile]
period = 20
percentile_lookback = 252

# =============================================================================
# TRANSITION RULES
# =============================================================================

[transition_rules]
min_regime_duration_days = 5  # Minimum days before allowing regime change
cooldown_days = 3             # Days to wait after a transition
gradual_transition = true     # Blend strategies during transition

[transition_rules.gradual]
blend_days = 5               # Days over which to blend old and new regime
old_weight_start = 0.8       # Start with 80% old regime
new_weight_end = 1.0         # End with 100% new regime

# =============================================================================
# DATA WINDOW MAPPING BY TIMEFRAME
# =============================================================================

[data_windows]
intraday = { min_months = 3, optimal_months = 6, max_months = 12 }
swing = { min_years = 1, optimal_years = 2, max_years = 5 }
position = { min_years = 2, optimal_years = 5, max_years = 10 }
long_term = { min_years = 5, optimal_years = 10, max_years = 20 }

# =============================================================================
# COMPUTATIONAL MAPPING BY TIMEFRAME
# =============================================================================

[computational_limits]
intraday = { population_size = 200, max_generations = 100, parallel_evals = 100 }
swing = { population_size = 150, max_generations = 80, parallel_evals = 50 }
position = { population_size = 100, max_generations = 50, parallel_evals = 20 }
long_term = { population_size = 50, max_generations = 30, parallel_evals = 10 }


