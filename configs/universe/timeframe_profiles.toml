# =============================================================================
# PROFILE: Adaptive (Option C)
# =============================================================================
# Timeframe adapts dynamically based on market volatility regime.
# System automatically selects appropriate strategies based on conditions.

[profiles.adaptive]
description = "Timeframe adaptativo baseado em regime de volatilidade"
mode = "dynamic"
regime_indicator = "atr_percentile"

[profiles.adaptive.regime_thresholds]
# ATR percentile thresholds for regime detection
low_volatility_max = 30      # 0-30% = low volatility
medium_volatility_max = 70   # 30-70% = medium volatility
high_volatility_min = 70     # 70-100% = high volatility

[profiles.adaptive.low_volatility]
description = "Mercado calmo - preferir position trading e estratégias de longo prazo"
preferred_timeframe = "position"
preferred_families = ["position", "factor", "buy_hold", "portfolio"]
holding_multiplier = 1.5
risk_adjustment = 0.8
allowed_strategies = [
    "position_trend_following_ma_conservative", "position_trend_following_ma_moderate",
    "position_fundamental_value_conservative", "position_fundamental_value_moderate",
    "portfolio_equal_weight_10_assets", "portfolio_equal_weight_20_assets",
    "portfolio_risk_parity_conservative", "portfolio_risk_parity_moderate",
    "portfolio_min_variance_conservative", "portfolio_min_variance_moderate",
    "factor_value_pe_conservative", "factor_quality_roe_conservative",
    "factor_low_volatility_conservative", "factor_multi_factor_balanced",
    "buy_hold_index_ibov", "buy_hold_index_sp500",
    "buy_hold_dividend_growth_conservative", "buy_hold_dividend_growth_moderate",
    "momentum_time_series_200d", "momentum_time_series_dual_ma"
]

[profiles.adaptive.medium_volatility]
description = "Mercado normal - preferir swing trading"
preferred_timeframe = "swing"
preferred_families = ["swing", "momentum", "mean_reversion", "breakout", "pair"]
holding_multiplier = 1.0
risk_adjustment = 1.0
allowed_strategies = [
    "swing_momentum_ma_crossover_conservative", "swing_momentum_ma_crossover_moderate",
    "swing_momentum_macd_moderate", "swing_momentum_macd_aggressive",
    "swing_mean_reversion_bb_conservative", "swing_mean_reversion_bb_moderate",
    "swing_mean_reversion_rsi_conservative", "swing_mean_reversion_rsi_moderate",
    "swing_breakout_channel_moderate", "swing_breakout_channel_aggressive",
    "swing_breakout_volume_moderate", "swing_breakout_volume_aggressive",
    "mean_reversion_bb_moderate", "mean_reversion_bb_trend_filtered",
    "mean_reversion_rsi_moderate", "mean_reversion_rsi_trend_filtered",
    "breakout_donchian_20d", "breakout_donchian_55d",
    "breakout_volatility_expansion_moderate",
    "momentum_cross_sectional_3m", "momentum_cross_sectional_6m",
    "momentum_time_series_50d", "momentum_time_series_dual_ma",
    "pair_trading_cointegration_moderate", "pair_trading_distance_moderate",
