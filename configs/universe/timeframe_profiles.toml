# =============================================================================
# Timeframe Profiles - Universe-Only System
# =============================================================================
# Defines timeframe-based strategy profiles (Options B + C from plan)
# B = per_timeframe: Distinct strategies by timeframe
# C = adaptive: Timeframe adapts based on market conditions
# =============================================================================

[metadata]
version = "1.0.0"
last_updated = "2026-01-06"
description = "Timeframe profiles for strategy selection and adaptation"

# =============================================================================
# PROFILE: Per-Timeframe (Option B)
# =============================================================================
# Assigns specific strategy families to each timeframe category.
# Users select a timeframe and only see strategies in that category.

[profiles.per_timeframe]
description = "Estratégias distintas por timeframe - cada horizonte tem famílias específicas"
mode = "static"

[profiles.per_timeframe.intraday]
label = "Intraday (1h bars)"
holding_period = "1-8 hours"
data_requirement = "1h OHLCV"
data_window_months = 6
families = ["intraday"]
hypotheses = ["breakout", "momentum", "mean_reversion"]
complexity_tiers = ["tier1_fast", "tier2_medium"]
strategies = [
    "orb_breakout_conservative", "orb_breakout_moderate", "orb_breakout_aggressive",
    "vwap_mean_reversion_conservative", "vwap_mean_reversion_moderate",
    "vwap_trend_following_moderate", "vwap_trend_following_aggressive",
    "intraday_mean_reversion_rsi_conservative", "intraday_mean_reversion_rsi_moderate",
    "intraday_mean_reversion_bb_conservative", "intraday_mean_reversion_bb_moderate",
    "intraday_momentum_macd_moderate", "intraday_momentum_macd_aggressive",
    "intraday_momentum_adx_moderate", "intraday_momentum_adx_aggressive",
    "gap_fill_conservative", "gap_fill_moderate",
    "gap_continuation_moderate", "gap_continuation_aggressive",
    "volume_profile_poc_moderate", "volume_profile_vah_val_moderate",
    "news_based_volatility_moderate"
]
min_trades_is = 50
min_trades_oos = 25
train_test_split = 0.70
wfa_enabled = false

[profiles.per_timeframe.swing]
label = "Swing Trading (2-10 days)"
holding_period = "2-10 days"
data_requirement = "Daily OHLCV"
data_window_years = 2
families = ["swing", "mean_reversion", "breakout"]
