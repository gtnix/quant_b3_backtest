# Example configuration for Buy and Hold Strategy
# B3 Backtester

[general]
name = "buy_and_hold_example"
initial_capital = 100000.0

[data]
path = "data/sample.csv"
skip_invalid = false

[strategy]
type = "buy_and_hold"

[execution]
slippage_type = "constant"
slippage_param = 5.0
fixed_cost = 10.0
proportional_bps = 10.0
max_participation = 0.1
allow_partial = true





















