[strategy]
id = "position_low_vol_conservative"
description = "Low volatility position conservador"

[[pipeline]]
type = "selection"
block_id = "low_vol"
params = { max_annualized_vol = 0.30, lookback_days = 120, top_pct = 20 }

[[pipeline]]
type = "exit"
block_id = "stop_loss"
params = { threshold_pct = 0.12 }

[[pipeline]]
type = "sizing"
block_id = "equal_weight"
params = { max_weight = 0.10, min_weight = 0.02, max_positions = 15 }
