# =============================================================================
# SCG Max Power - All CPU Resources
# =============================================================================
# Maximum CPU usage for aggressive strategy discovery
# =============================================================================

[campaign]
name = "scg_maxpower"
description = "Maximum power mining - all CPU cores"
version = "1.0.0"

[dataset]
market = "BR"
market_data_path = "data/market_data_ibov.csv"

[risk_profile]
name = "agressivo"

[evolution]
population_size = 200
max_generations = 1000
tournament_size = 4
crossover_rate = 0.90
elitism_rate = 0.08
mutation_rate = 0.10
convergence_generations = 30
max_runtime_seconds = 86400
workers = 0  # 0 = use all available cores
hall_of_fame_size = 50

[diversity]
enabled = true
sigma_share = 0.15
sharing_alpha = 2.0
fitness_sharing = true
phenotypic_distance = true
critical_threshold = 0.20
crowding_factor = 4

[adaptation]
enabled = true
base_mutation_rate = 0.08
min_mutation_rate = 0.02
max_mutation_rate = 0.40
amplification_factor = 2.5

[stagnation]
detection_enabled = true
window_size = 15
improvement_threshold = 0.003
restart_enabled = true
restart_elite_ratio = 0.15
post_restart_boost_generations = 8
max_restarts = 10

[execution]
mode = "compiled"
has_costs = true
slippage_bps = 10.0
commission_bps = 5.0
emolument_bps = 2.5
market_impact_model = "linear"

[validation]
enabled = true
top_k = 20
wfa_enabled = true
wfa_num_folds = 6
wfa_is_ratio = 0.6
wfa_purge_days = 5
pbo_enabled = true
pbo_significance_level = 0.05
stress_enabled = true
stress_min_pass = 5

[gates]
gates_required = true
min_oos_sharpe_net = 0.60
max_pbo = 0.12
min_stress_passed = 5
max_degradation = 0.30
min_oos_trades = 50
max_drawdown = -0.18

[data_integrity]
enabled = true
lookback_requirements = true
survivorship_bias_check = true

[metrics]
objectives = ["sharpe_ratio", "cagr", "max_drawdown", "calmar_ratio"]
sharpe_weight = 2.0
cagr_weight = 1.5
drawdown_weight = 4.0
calmar_weight = 1.5
sortino_weight = 0.8
low_trades_penalty = true
min_trades = 50
extreme_turnover_penalty = true
max_turnover_annual = 300.0
high_volatility_penalty = true
max_volatility = 0.30
drawdown_penalty_threshold = -0.12

[output]
artifact_format = "obfs"
save_generations = true
save_all_genomes = false
save_diversity_metrics = true
save_restart_events = true




