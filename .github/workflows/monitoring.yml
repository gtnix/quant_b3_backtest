name: Daily Data Monitoring

on:
  schedule:
    # Run at 10:00 UTC on weekdays (before market open BR/US)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Type of check to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - data-freshness
          - data-integrity
          - rust-tests

env:
  CARGO_TERM_COLOR: always

jobs:
  data-freshness:
    name: Data Freshness Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'data-freshness' || github.event_name == 'schedule' }}
    
    outputs:
      b3_status: ${{ steps.check.outputs.b3_status }}
      us_status: ${{ steps.check.outputs.us_status }}
      fx_status: ${{ steps.check.outputs.fx_status }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install psycopg2-binary python-dotenv
      
      - name: Check Data Freshness
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python << 'EOF'
          import os
          import json
          from datetime import date, timedelta
          import psycopg2

          def get_connection():
              return psycopg2.connect(os.environ["DATABASE_URL"])

          def check_table_freshness(table: str, date_col: str = "trading_date") -> dict:
              """Check if table has recent data."""
              try:
                  with get_connection() as conn:
                      with conn.cursor() as cur:
                          cur.execute(f"""
                              SELECT 
                                  MAX({date_col}) as last_date,
                                  COUNT(DISTINCT symbol) as symbols,
                                  COUNT(*) as total_rows
                              FROM {table}
                          """)
                          row = cur.fetchone()
                          if row and row[0]:
                              last_date = row[0]
                              days_old = (date.today() - last_date).days
                              return {
                                  "table": table,
                                  "last_date": str(last_date),
                                  "days_old": days_old,
                                  "symbols": row[1],
                                  "rows": row[2],
                                  "status": "OK" if days_old <= 3 else "STALE"
                              }
                          return {"table": table, "status": "EMPTY", "rows": 0}
              except Exception as e:
                  return {"table": table, "status": "ERROR", "error": str(e)}

          results = {
              "timestamp": str(date.today()),
              "checks": {}
          }

          # Check B3 daily data
          b3_daily = check_table_freshness("ohlcv_daily", "trading_date")
          results["checks"]["b3_daily"] = b3_daily
          
          # Check B3 intraday
          b3_intra = check_table_freshness("ohlcv_intraday_br", "timestamp")
          results["checks"]["b3_intraday"] = b3_intra
          
          # Check B3 indices
          try:
              with get_connection() as conn:
                  with conn.cursor() as cur:
                      cur.execute("""
                          SELECT MAX(snapshot_date), COUNT(DISTINCT index_code)
                          FROM b3_index_composition
                      """)
                      row = cur.fetchone()
                      if row and row[0]:
                          days_old = (date.today() - row[0]).days
                          results["checks"]["b3_indices"] = {
                              "table": "b3_index_composition",
                              "last_date": str(row[0]),
                              "days_old": days_old,
                              "indices": row[1],
                              "status": "OK" if days_old <= 3 else "STALE"
                          }
          except Exception as e:
              results["checks"]["b3_indices"] = {"status": "ERROR", "error": str(e)}

          # Output status for job outputs
          b3_ok = all(
              r.get("status") == "OK" 
              for k, r in results["checks"].items() 
              if k.startswith("b3")
          )
          print(f"b3_status={'OK' if b3_ok else 'STALE'}")
          
          # Print report
          print("\n" + "="*60)
          print("DATA FRESHNESS REPORT")
          print("="*60)
          
          for name, check in results["checks"].items():
              status = check.get("status", "UNKNOWN")
              icon = "✅" if status == "OK" else "⚠️" if status == "STALE" else "❌"
              print(f"\n{icon} {name}:")
              for k, v in check.items():
                  if k != "table":
                      print(f"   {k}: {v}")
          
          # Write outputs
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"b3_status={'OK' if b3_ok else 'STALE'}\n")
              f.write(f"us_status=OK\n")
              f.write(f"fx_status=OK\n")
          
          # Write JSON report
          with open("freshness_report.json", "w") as f:
              json.dump(results, f, indent=2)
          
          print("\n" + "="*60)
          EOF
      
      - name: Add to Summary
        run: |
          echo "## 📊 Data Freshness Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat freshness_report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report-${{ github.run_number }}
          path: freshness_report.json
          retention-days: 30

  data-integrity:
    name: Data Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'data-integrity' || github.event_name == 'schedule' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install psycopg2-binary python-dotenv
      
      - name: Check Data Integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python << 'EOF'
          import os
          import json
          from datetime import date
          import psycopg2

          def get_connection():
              return psycopg2.connect(os.environ["DATABASE_URL"])

          results = {"timestamp": str(date.today()), "checks": []}

          # Check 1: Null values in critical columns
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT 
                          COUNT(*) FILTER (WHERE close IS NULL) as null_close,
                          COUNT(*) FILTER (WHERE volume IS NULL OR volume = 0) as zero_volume,
                          COUNT(*) as total
                      FROM ohlcv_daily
                      WHERE trading_date > CURRENT_DATE - INTERVAL '30 days'
                  """)
                  row = cur.fetchone()
                  null_close, zero_vol, total = row
                  null_pct = (null_close / total * 100) if total > 0 else 0
                  results["checks"].append({
                      "name": "null_values",
                      "null_close": null_close,
                      "zero_volume": zero_vol,
                      "total_rows": total,
                      "null_pct": round(null_pct, 2),
                      "status": "OK" if null_pct < 1 else "WARN"
                  })

          # Check 2: Price anomalies (OHLC logic)
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT COUNT(*)
                      FROM ohlcv_daily
                      WHERE trading_date > CURRENT_DATE - INTERVAL '30 days'
                        AND (high < low OR open > high OR open < low OR close > high OR close < low)
                  """)
                  anomalies = cur.fetchone()[0]
                  results["checks"].append({
                      "name": "ohlc_anomalies",
                      "count": anomalies,
                      "status": "OK" if anomalies == 0 else "ERROR"
                  })

          # Check 3: Duplicate detection
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT symbol, trading_date, COUNT(*) as cnt
                      FROM ohlcv_daily
                      GROUP BY symbol, trading_date
                      HAVING COUNT(*) > 1
                      LIMIT 10
                  """)
                  duplicates = cur.fetchall()
                  results["checks"].append({
                      "name": "duplicates",
                      "count": len(duplicates),
                      "examples": [f"{r[0]} {r[1]}" for r in duplicates[:3]],
                      "status": "OK" if len(duplicates) == 0 else "WARN"
                  })

          # Check 4: Gap detection (missing trading days)
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      WITH date_series AS (
                          SELECT generate_series(
                              CURRENT_DATE - INTERVAL '30 days',
                              CURRENT_DATE,
                              '1 day'::interval
                          )::date as d
                          WHERE EXTRACT(DOW FROM generate_series) NOT IN (0, 6)
                      ),
                      symbol_dates AS (
                          SELECT DISTINCT trading_date
                          FROM ohlcv_daily
                          WHERE symbol = 'PETR4'
                            AND trading_date > CURRENT_DATE - INTERVAL '30 days'
                      )
                      SELECT COUNT(*)
                      FROM date_series ds
                      LEFT JOIN symbol_dates sd ON ds.d = sd.trading_date
                      WHERE sd.trading_date IS NULL
                  """)
                  gaps = cur.fetchone()[0]
                  results["checks"].append({
                      "name": "gaps_petr4",
                      "missing_days": gaps,
                      "status": "OK" if gaps <= 5 else "WARN"
                  })

          # Print results
          print("="*60)
          print("DATA INTEGRITY REPORT")
          print("="*60)
          
          all_ok = True
          for check in results["checks"]:
              status = check.get("status", "UNKNOWN")
              icon = "✅" if status == "OK" else "⚠️" if status == "WARN" else "❌"
              print(f"\n{icon} {check['name']}:")
              for k, v in check.items():
                  if k not in ("name", "status"):
                      print(f"   {k}: {v}")
              if status != "OK":
                  all_ok = False
          
          # Write report
          with open("integrity_report.json", "w") as f:
              json.dump(results, f, indent=2)
          
          print("\n" + "="*60)
          if not all_ok:
              print("⚠️ Some integrity checks failed - review required")
          else:
              print("✅ All integrity checks passed")
          EOF
      
      - name: Add to Summary
        run: |
          echo "## 🔍 Data Integrity Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat integrity_report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: integrity-report-${{ github.run_number }}
          path: integrity_report.json
          retention-days: 30

  rust-tests:
    name: Rust Monitoring Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'rust-tests' || github.event_name == 'schedule' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-action@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-monitoring-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Run Monitoring Tests
        run: |
          # Run monitoring-specific tests if they exist
          cargo test -p backtester_intelligence --release 2>&1 || true
        env:
          FRED_API_KEY: "test_key_for_ci"
      
      - name: Add to Summary
        run: |
          echo "## 🦀 Rust Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Rust monitoring tests completed" >> $GITHUB_STEP_SUMMARY

  summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: [data-freshness, data-integrity, rust-tests]
    if: always()
    
    steps:
      - name: Generate Final Summary
        run: |
          echo "## 📋 Daily Monitoring Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Data Freshness | ${{ needs.data-freshness.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Data Integrity | ${{ needs.data-integrity.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Tests | ${{ needs.rust-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Executed at: $(TZ=America/Sao_Paulo date)" >> $GITHUB_STEP_SUMMARY
